<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f2eb"><title>Sela — ruang pribadi</title><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head>
<body><header><a class="wordmark" href="/">sela<span> / </span></a><span>Ruang untuk berpikir lantang.</span></header>
<main><span class="eyebrow">RUANG PRIBADI</span><h1 id="auth-title">Selamat datang.</h1><p id="auth-description">Masuk untuk melanjutkan percakapan.</p>
<form id="auth-form"><label for="username">Nama pengguna</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="64" pattern="[A-Za-z0-9_.-]{3,64}" required autocapitalize="none" spellcheck="false"><label for="password">Kata sandi</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required><p id="auth-error" role="alert" hidden></p><button id="auth-submit" type="submit">Lanjutkan ↗</button></form>
<footer>Satu akun. Percakapan pribadi.<br>Tidak ada pendaftaran umum.</footer></main></body></html>
